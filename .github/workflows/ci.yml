
name: CI

on:
  push:
    branches: [master, release-staging]
  pull_request:
    branches: [master, release-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build CLI
        run: zig build -Doptimize=ReleaseFast

      - name: Check compilation
        run: zig build check

      - name: Run Zig tests
        run: zig build test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test C and Python bindings
        run: zig build test-bindings -Dpython=python

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test JavaScript and TypeScript bindings
        run: |
          npm ci --prefix bindings/js
          npm run build --prefix bindings/js
          ./zig-out/bin/zgc compile bindings/tests/fixtures/smoke.zgir --target wasm32-freestanding --bind-outputs -o "$RUNNER_TEMP/zgc-smoke.wasm"
          npm test --prefix bindings/js -- "$RUNNER_TEMP/zgc-smoke.wasm"
