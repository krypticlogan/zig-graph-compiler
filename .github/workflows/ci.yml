
name: CI

on:
  push:
    branches: [master, release-staging]
  pull_request:
    branches: [master, release-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build CLI
        run: zig build -Doptimize=ReleaseFast

      - name: Check compilation
        run: zig build check

      - name: Run Zig tests
        run: zig build test

      - name: Test C and Python bindings
        run: zig build test-bindings
