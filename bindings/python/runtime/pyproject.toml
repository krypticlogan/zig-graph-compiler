[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zgc-runtime"
version = "0.1.0"
description = "Python runtime for ZGC executable artifacts"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zgc = ["py.typed"]
