[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zgc-runtime"
version = "0.2.0"
description = "Python bindings for ZGC model artifacts"
requires-python = ">=3.10"

[project.scripts]
zgc = "zgc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zgc = ["py.typed"]
