[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zgc-compiler"
version = "0.1.0"
description = "Python graph frontend and external compiler for ZGC executables"
requires-python = ">=3.10"
dependencies = ["zgc-runtime>=0.1.0"]

[project.scripts]
zgc-compiler = "zgc_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zgc_compiler = ["py.typed"]
